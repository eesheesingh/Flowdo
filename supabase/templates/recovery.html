<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; padding:40px;">
            <tr>
              <td style="font-size:20px; font-weight:700; color:#4F46E5; padding-bottom:24px;">
                FlowDo
              </td>
            </tr>
            <tr>
              <td style="font-size:20px; font-weight:600; color:#18181b; padding-bottom:12px;">
                Reset your password
              </td>
            </tr>
            <tr>
              <td style="font-size:14px; color:#52525b; padding-bottom:24px;">
                Click the button below to choose a new password for your FlowDo account.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                   style="display:inline-block; font-size:15px; font-weight:600; color:#ffffff; background-color:#4F46E5; border-radius:8px; padding:12px 28px; text-decoration:none;">
                  Reset password
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px; color:#71717a; padding-bottom:24px;">
                This link expires shortly.
              </td>
            </tr>
            <tr>
              <td style="font-size:13px; color:#71717a; padding-bottom:24px;">
                If you didn't request a password reset, you can safely ignore this email.
              </td>
            </tr>
            <tr>
              <td style="font-size:12px; color:#a1a1aa; border-top:1px solid #e4e4e7; padding-top:16px;">
                &copy; FlowDo
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
